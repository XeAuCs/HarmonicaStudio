[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonica-studio"
version = "1.4.9"
description = "Local MIDI melody conversion, harmonica script export and desktop preview"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.11.2", "segno==1.6.6"]

[project.scripts]
harmonica-studio = "harmonica_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harmonica_studio = ["assets/*.ahk", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.html", "assets/*.css", "assets/*.js"]
