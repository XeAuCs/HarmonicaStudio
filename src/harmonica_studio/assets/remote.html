<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F4F1EA">
  <title>口琴工坊 · 随身遥控</title>
  <link rel="stylesheet" href="/remote.css">
  <script src="/remote.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
          <path d="M7 28 33 15l5 9L12 37zM7 28l-2-5L31 10l2 5M14 30l-2-4m8 1-2-4m8 1-2-4m8 1-2-4M9 15l11-6m-9 1 5-3"/>
        </svg>
        <div><p class="eyebrow">HARMONICA / REMOTE</p><h1>口琴工坊</h1></div>
      </div>
      <span class="connection" id="connection" data-state="connecting"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">连接中</span></span>
    </header>

    <div class="notice" id="connection-notice" role="status" hidden></div>
    <noscript><p class="notice">请在浏览器中启用 JavaScript，才能连接电脑。</p></noscript>

    <main>
      <section class="player" aria-labelledby="player-heading">
        <div class="section-heading"><h2 id="player-heading">电脑演奏</h2><span class="section-caption">手机选曲 · 电脑发声</span></div>
        <div class="mode-switch" role="group" aria-label="播放方式">
          <button id="mode-preview" class="mode active" type="button" aria-pressed="true">电脑试听</button>
          <button id="mode-game" class="mode" type="button" aria-pressed="false">游戏演奏</button>
        </div>

        <div class="score-cover" id="score-cover">
          <canvas id="score-canvas" role="img" aria-label="曲谱预览，中央刻度线为当前播放位置" data-score-id="" data-note-count="0"></canvas>
        </div>
        <div class="song-heading"><p class="eyebrow" id="player-state">等待连接</p><h3 id="song-title">选一首，慢慢听</h3></div>

        <div class="timeline">
          <label class="visually-hidden" id="seek-label" for="seek">试听进度</label>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-valuetext="0 分 0 秒">
          <div class="game-progress" id="game-progress" role="progressbar" aria-label="游戏演奏进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span id="game-progress-fill"></span></div>
          <div class="time-labels"><span id="position">0:00</span><span id="duration">0:00</span></div>
        </div>

        <div class="transport-controls">
          <button class="primary-control" id="play" type="button" disabled>
            <svg class="control-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path id="play-icon" d="m9 5 10 7-10 7V5Z"/></svg>
            <span id="play-label">播放</span>
          </button>
          <button class="stop-control" id="stop" type="button" disabled>
            <svg class="control-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
            <span>停止</span>
          </button>
        </div>
        <p class="mode-hint" id="mode-hint">声音从电脑播放，手机只负责控制。</p>
        <p class="activity-status" id="activity-status" role="status" aria-live="polite"></p>
      </section>

      <section class="library" aria-labelledby="library-heading">
        <div class="section-heading"><h2 id="library-heading">曲库<span class="library-count" id="library-count">—</span></h2><button class="icon-button" id="refresh" type="button" aria-label="刷新曲库" title="刷新曲库" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg></button></div>
        <div class="search-field"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><label class="visually-hidden" for="search">搜索曲目</label><input id="search" type="search" placeholder="搜索曲目" autocomplete="off" spellcheck="false" enterkeyhint="search"><button id="clear-search" class="icon-button" type="button" aria-label="清空搜索" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
        <p class="library-empty" id="library-empty">连接后显示电脑曲库</p>
        <ol class="song-list" id="song-list"></ol>
      </section>
    </main>
    <footer>同一局域网 · 连接由电脑提供</footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
